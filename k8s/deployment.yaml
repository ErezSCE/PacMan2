apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-web
  labels:
    app: pacman-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pacman-web
  template:
    metadata:
      labels:
        app: pacman-web
    spec:
      containers:
        - name: pacman-web
          image: ${DOCKER_IMAGE_NAME:-myapp}:${DOCKER_TAG:-latest}
          ports:
            - containerPort: 80
          env:
            - name: NODE_ENV
              value: "${NODE_ENV:-production}"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
